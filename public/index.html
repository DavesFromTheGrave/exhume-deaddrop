<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dead Drop</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- LEVEL SELECT -->
  <section id="select" class="screen">
    <header class="crypt-head">
      <img id="masthead" class="masthead" alt="" hidden />
      <h1 id="game-title">Dead Drop</h1>
      <p class="tagline" id="tagline"></p>
      <p class="allowance" id="select-allowance"></p>
      <p class="doors" id="doors" hidden></p>
    </header>
    <div id="level-grid" class="level-grid"></div>
    <footer class="foot">
      <span id="provider-note"></span>
      <span>Revenant Systems</span>
    </footer>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen" hidden>
    <header class="play-head">
      <button id="back" class="ghost" aria-label="Back to the levels">‹ <span id="back-label">levels</span></button>
      <div class="play-title">
        <span id="play-world" class="world"></span>
        <span id="play-name" class="name"></span>
        <span id="play-attempt" class="attempt"></span>
      </div>
      <div class="meters">
        <span class="meter" title="Exchanges left on this attempt">🕯 <b id="candles">0</b></span>
        <span class="meter" title="Guesses left on this attempt">⛏ <b id="digs">0</b></span>
      </div>
    </header>

    <div class="play-body">
      <aside id="rack" class="rack" aria-label="Active defenses"></aside>

      <main class="stage">
        <div id="chat" class="chat" aria-live="polite"></div>

        <form id="turn-form" class="turn">
          <textarea id="turn-input" rows="2" aria-describedby="message-limit" autocomplete="off"></textarea>
          <button id="send" type="submit">Send</button>
        </form>

        <div class="turn-meta">
          <p id="message-limit" class="allowance"></p>
          <button id="hint" type="button" class="ghost small">Buy a hint</button>
        </div>

        <form id="claim-form" class="claim">
          <input id="claim-input" type="text" autocomplete="off" />
          <button id="claim" type="submit" class="dig">Speak the word</button>
        </form>
        <p class="allowance" id="play-allowance"></p>
      </main>
    </div>
  </section>

  <!-- REVEAL -->
  <div id="reveal" class="reveal" hidden>
    <div class="reveal-card" role="dialog" aria-modal="true" aria-labelledby="reveal-title">
      <p class="reveal-eyebrow" id="reveal-eyebrow"></p>
      <h2 id="reveal-title"></h2>
      <p class="reveal-secret"><span id="reveal-verb"></span> <b id="reveal-secret"></b></p>

      <div class="reveal-block">
        <h3>The lesson</h3>
        <p id="reveal-lesson"></p>
      </div>

      <div class="reveal-block">
        <h3 id="reveal-tech-title"></h3>
        <p id="reveal-tech-how"></p>
      </div>

      <div class="reveal-block">
        <h3>The fix</h3>
        <p id="reveal-fix"></p>
        <a id="reveal-doc" href="#" target="_blank" rel="noopener">Read the field guide ›</a>
      </div>

      <details class="reveal-block">
        <summary id="reveal-guard-summary"></summary>
        <pre id="reveal-guard"></pre>
        <p class="reveal-config" id="reveal-config"></p>
      </details>

      <details class="reveal-block" id="reveal-win-wrap">
        <summary>Your winning move</summary>
        <pre id="reveal-win"></pre>
      </details>

      <div class="reveal-actions">
        <button id="reveal-next" class="dig"></button>
        <button id="reveal-close" class="ghost"></button>
      </div>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
