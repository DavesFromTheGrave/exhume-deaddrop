name = "exhume"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# The static client is served from the same Worker/origin.
[assets]
directory = "./public"
binding = "ASSETS"

# Plain config. Strings on purpose (the Worker Number()s the caps).
[vars]
# Which campaign is live: "35" (crypt, levels.js) or "15" (D&D recut, levels.15.js).
# Switching deletes nothing and progress is kept per ladder; flip back to roll back.
LADDER = "35"
# mock | workers-ai | groq | google | ollama. groq needs GROQ_API_KEY in .dev.vars
# (local) or `wrangler secret put GROQ_API_KEY` (prod). For offline play with no
# key: npx wrangler dev --var PROVIDER:mock
PROVIDER = "groq"
GROQ_MODEL = "openai/gpt-oss-20b"   # llama-3.1-8b-instant was retired on the free tier 2026-08-16
DAILY_CANDLES = "300"      # model turns per player per day (candles.js default; a full run fits)
# THE global ceiling. Free-tier accounts take no card, so this caps quota, not money.
# Keep it at or below the provider's daily request limit (Groq free, gpt-oss-20b:
# about 1,000/day per third-party summaries; check your account's limits page).
GLOBAL_DAILY_TURNS = "1000"

# --- Optional bindings. Uncommented + created, the Worker uses them; left off,
# --- it falls back to in-memory counters and console logging (fine for local).
#
# Per-player / global candle counters (durable):
# [[kv_namespaces]]
# binding = "EXHUME_KV"
# id = "PUT_YOUR_KV_ID_HERE"      # wrangler kv namespace create EXHUME_KV
#
# Attempt log for research (queryable):
# [[d1_databases]]
# binding = "EXHUME_DB"
# database_name = "exhume"
# database_id = "PUT_YOUR_D1_ID_HERE"  # wrangler d1 create exhume, then apply schema.sql
#
# Real guard on Cloudflare's free neuron pool (set PROVIDER = "workers-ai"):
# [ai]
# binding = "AI"
# and pick a live model (the old llama-3.1-8b-instruct was retired 2026-05-30):
#   npx wrangler ai models list --search llama   then add WORKERS_AI_MODEL = "<id>" to [vars].

# SERVER_KEY (secret, not a var) keys the word derivation in production:
#   wrangler secret put SERVER_KEY
# Provider API keys for groq/google go in .dev.vars locally and as secrets in prod.
